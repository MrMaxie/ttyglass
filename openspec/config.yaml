schema: spec-driven

context: |
  npm publication is release-gated: a GitHub Release tag must match the package version, all verification must pass, and the published registry package must pass a post-publication smoke test.
  Public versions follow Semantic Versioning and CHANGELOG.md follows Keep a Changelog.
  Dependency and tool versions must be exact in manifests and lockfiles; version ranges are not allowed.
  Accepted behavior belongs in openspec/specs, while active work belongs in openspec/changes.
  Project-facing artifacts are written in English.

rules:
  proposal:
    - "Keep each proposal focused on one observable product or engineering outcome."
    - "State non-goals when they prevent accidental scope expansion."
  tasks:
    - "Break work into independently verifiable steps and name the relevant just command."
